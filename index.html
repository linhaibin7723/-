<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>口语句库</title>
<meta name="theme-color" content="#f2f2f7">
<style>
:root{--bg:#f2f2f7;--fg:#1c1c1e;--mut:#6e6e73;--card:rgba(255,255,255,.62);--acc:#007aff;--accfg:#fff;--bd:rgba(60,60,67,.16);--hl:rgba(0,122,255,.12);--glass:rgba(248,248,250,.72);--bl1:rgba(120,170,255,.5);--bl2:rgba(255,175,205,.38);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#f5f5f7;--mut:#98989f;--card:rgba(44,44,48,.55);--acc:#0a84ff;--accfg:#fff;--bd:rgba(255,255,255,.13);--hl:rgba(10,132,255,.24);--glass:rgba(28,28,30,.7);--bl1:rgba(10,90,200,.5);--bl2:rgba(130,60,190,.38);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--fg:#f5f5f7;--mut:#98989f;--card:rgba(44,44,48,.55);--acc:#0a84ff;--accfg:#fff;--bd:rgba(255,255,255,.13);--hl:rgba(10,132,255,.24);--glass:rgba(28,28,30,.7);--bl1:rgba(10,90,200,.5);--bl2:rgba(130,60,190,.38);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,"PingFang SC","Noto Sans SC",system-ui,sans-serif}
body{display:flex;flex-direction:column;max-width:680px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
header{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-bottom:1px solid var(--bd)}
header b{font-size:17px}
.ib{width:42px;height:42px;font-size:20px;border-radius:10px}
#chat{flex:1;overflow-y:auto;padding:12px 14px}
.u{background:var(--acc);color:var(--accfg);padding:9px 13px;border-radius:16px 16px 4px 16px;margin:10px 0 10px auto;max-width:85%;width:fit-content;white-space:pre-wrap}
.a{margin:10px 0}
.s{background:var(--card);border-radius:12px;padding:10px 8px 10px 12px;margin:6px 0;display:flex;gap:6px;align-items:flex-start}
.tx{flex:1;min-width:0}
.ac{display:flex;gap:2px;flex:none}
.ac button{width:38px;height:38px;font-size:18px;border-radius:10px}
.ac button:active{background:var(--hl)}
.fb.on{color:#f5a623}
.en{font-size:19px;font-weight:600;line-height:1.35}
.zh{color:var(--mut);font-size:15px}
.lb{font-size:13px;color:var(--mut);margin:14px 0 2px}
.note{margin-top:6px}
.th{color:var(--mut);padding:8px 0}
.err{color:#d33}
.hello{text-align:center;color:var(--mut);margin-top:9vh}
.hello h2{color:var(--fg);margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:8px 14px;border-radius:999px;font-size:14px}
.inp{display:flex;gap:8px;align-items:flex-end;padding:8px 10px;border-top:1px solid var(--bd)}
textarea{flex:1;max-height:120px;min-height:42px;padding:10px 14px;border-radius:22px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:inherit;resize:none}
#send{width:42px;height:42px;border-radius:50%;background:var(--acc);color:var(--accfg);font-size:18px;flex:none}
#send:disabled{opacity:.4}
.ov{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;max-width:680px;margin:0 auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs{display:flex;gap:6px;padding:8px 12px}
.tab{padding:6px 16px;border-radius:999px;border:1px solid var(--bd);font-size:14px}
.tab.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
#lst{flex:1;overflow-y:auto;padding:0 14px}
.empty{color:var(--mut);text-align:center;margin-top:60px}
.lp{display:flex;gap:10px;padding:10px 12px;border-top:1px solid var(--bd)}
.lp button{flex:1;padding:11px;border-radius:12px;background:var(--acc);color:var(--accfg);font-weight:600}
.lp button.g{background:var(--card);color:var(--fg)}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:680px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .en{font-size:18px}
.acts{display:flex;gap:8px;margin-top:14px}
.acts button{flex:1;padding:11px 4px;border-radius:12px;background:var(--card);font-size:15px}
.vv{width:100%;max-height:34vh;background:#000}
.vb{display:flex;gap:8px;padding:8px 12px;flex-wrap:wrap}
.vb .tab{cursor:pointer}
.vst{padding:0 14px 6px;color:var(--mut);font-size:13px;min-height:22px}
#vl{flex:1;overflow-y:auto;padding:0 14px}
.s.now{background:var(--hl)}
.tm{margin-top:4px;font-size:13px;color:var(--acc)}
.sel{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:inherit}
.acts button.on{background:var(--acc);color:var(--accfg)}
/* 极简毛玻璃 */
:root{--fx:radial-gradient(60% 40% at 12% 0%,var(--bl1),transparent 70%),radial-gradient(55% 40% at 98% 28%,var(--bl2),transparent 70%)}
html{background:var(--fx),var(--bg);background-attachment:fixed}
body{background:transparent}
.ov{background:var(--fx),var(--bg)}
.s,header,.inp,.chip,.tab,.sheet,.lp{-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
header{background:var(--glass);border-bottom:.5px solid var(--bd)}
header b{font-size:17px;font-weight:600}
.hello h2{font-size:28px;font-weight:700;letter-spacing:-.01em}
.s{background:var(--card);border:.5px solid var(--bd);border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 26px -14px rgba(0,0,0,.22)}
.s.now{background:var(--hl);border-color:var(--acc)}
.u{background:var(--acc);color:#fff;border-radius:18px 18px 4px 18px}
.lb{font-size:12px;color:var(--mut);margin:16px 0 4px 4px}
.inp,.lp{background:var(--glass);border-top:.5px solid var(--bd)}
textarea{background:var(--card);border:.5px solid var(--bd);border-radius:21px}
textarea:focus{outline:0;border-color:var(--acc)}
.chip,.tab{background:var(--card);border:.5px solid var(--bd)}
.tab.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.sheet{background:var(--glass);border-top:.5px solid var(--bd);box-shadow:0 -12px 40px rgba(0,0,0,.16)}
.mask{background:rgba(0,0,0,.28)}
.fb.on{color:#ff9f0a}
.cwrap{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
.cardbox{width:100%;max-width:420px;min-height:46vh;border-radius:28px;padding:28px 22px;display:flex;flex-direction:column;justify-content:center;text-align:center;background:var(--card);border:.5px solid var(--bd);box-shadow:0 24px 56px -24px rgba(0,0,0,.35);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);cursor:pointer}
.cardbox .en{font-size:26px;animation:pop .25s ease}
.cardbox .zh{margin-top:22px;font-size:18px;color:var(--fg);animation:pop .25s ease}
.cardbox .hint,.cardbox .cnt{color:var(--mut);font-size:14px}
.cardbox .hint{margin-top:22px}
.cardbox .cnt{margin-bottom:14px;font-size:13px}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
.hide{display:none}
</style>
</head>
<body>
<header>
  <button class="ib" id="bCol" aria-label="收藏">⭐</button>
  <b>口语句库</b>
  <span><button class="ib" id="bSet" aria-label="朗读设置">⚙️</button><button class="ib" id="bVid" aria-label="视频字幕">🎬</button><button class="ib" id="bNew" aria-label="新对话">🗑</button></span>
</header>
<div id="chat"></div>
<div class="inp">
  <textarea id="q" rows="1" placeholder="想说什么？用中文问，或贴英文…"></textarea>
  <button id="send" aria-label="发送">➤</button>
</div>

<div class="ov hide" id="col">
  <header><button class="ib" id="bBack" aria-label="返回">←</button><b>我的句库</b><span class="ib"></span></header>
  <div class="tabs"><button class="tab on" id="tF">收藏</button><button class="tab" id="tR">最近</button></div>
  <div id="lst"></div>
  <div class="lp"><button id="loop">🔁 循环播放</button><button class="g" id="zhT">隐藏中文</button><button class="g" id="bCard">🎴 抽卡</button></div>
</div>
<div class="ov hide" id="vid">
  <header><button class="ib" id="bVBack" aria-label="返回">←</button><b>视频字幕</b><span class="ib"></span></header>
  <video id="vp" class="vv" controls playsinline></video>
  <div class="vb">
    <label class="tab">🎬 选视频<input type="file" id="vf" accept="video/*" hidden></label>
    <label class="tab">📄 导入字幕<input type="file" id="sf" accept=".srt,.vtt" hidden></label>
    <button class="tab on" id="scan">🔍 AI 识别画面字幕</button>
  </div>
  <div class="vst" id="vst">选一个视频。有 .srt/.vtt 字幕文件就导入；没有的话，AI 会从当前播放位置起识别画面里的字幕。</div>
  <div id="vl"></div>
</div>
<div class="ov hide" id="card">
  <header><button class="ib" id="cBack" aria-label="返回">←</button><b>抽卡</b><span class="ib"></span></header>
  <div class="cwrap"><div class="cardbox" id="cbox"></div></div>
  <div class="lp"><button class="g" id="cSay">🔊 再听一次</button><button id="cNext">下一张 ➜</button></div>
</div>
<div class="mask hide" id="mask"><div class="sheet" id="sheet"></div></div>

<script>
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function ld(k){try{return JSON.parse(localStorage.getItem(k)||"[]")}catch(e){return[]}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var msgs=ld("msgs"),favs=ld("favs"),hist=ld("hist"),sample=null,busy=false;

/* 朗读 */
var voices=[],voice=null,rate=.85;
try{rate=parseFloat(localStorage.getItem("rate"))||.85}catch(e){}
function pv(){
  try{
    voices=speechSynthesis.getVoices().filter(function(x){return x.lang.replace("_","-")==="en-US"});
    var n=null;try{n=localStorage.getItem("voice")}catch(e){}
    voice=voices.filter(function(x){return x.name===n})[0]||voices[0]||null;
  }catch(e){}
}
pv();try{speechSynthesis.onvoiceschanged=pv}catch(e){}
var looping=false,spk=0;
function say(t,done){
  var id=++spk;
  try{speechSynthesis.cancel()}catch(e){}
  var parts=t.match(/[^,;:]+[,;:]?/g)||[t],i=0;
  (function next(){
    if(id!==spk)return;
    if(i>=parts.length){done&&done();return}
    var u;
    try{u=new SpeechSynthesisUtterance(parts[i++].trim());u.lang="en-US";u.rate=rate;if(voice)u.voice=voice}catch(e){done&&done();return}
    u.onend=u.onerror=function(){if(id!==spk)return;setTimeout(next,i<parts.length?260:0)};
    speechSynthesis.speak(u);
  })();
}
function stopLoop(){looping=false;spk++;try{speechSynthesis.cancel()}catch(e){}$("loop").textContent="🔁 循环播放"}
function isFav(en){return favs.some(function(f){return f.en===en})}

/* 对话渲染 */
var SUGG=["你吃了吗？","我有点累了","能再说一遍吗？","我马上就到"];
function AC(en){var f=isFav(en);return '<div class="ac"><button class="pb" aria-label="朗读">🔊</button><button class="fb'+(f?' on':'')+'" aria-label="收藏">'+(f?'★':'☆')+'</button></div>'}
function S(en,zh){return '<div class="s" data-en="'+esc(en)+'" data-zh="'+esc(zh||"")+'"><div class="tx"><div class="en">'+esc(en)+'</div>'+(zh?'<div class="zh">'+esc(zh)+'</div>':'')+'</div>'+AC(en)+'</div>'}
function aiHtml(r){
  var h='<div class="a">'+S(r.en,r.zh);
  if(r.note)h+='<div class="note">'+esc(r.note)+'</div>';
  if(r.vocab&&r.vocab.length){h+='<div class="lb">关键词</div>'+r.vocab.map(function(v){return '<div><b>'+esc(v.w)+'</b>　'+esc(v.m)+'</div>'}).join("")}
  if(r.examples&&r.examples.length){h+='<div class="lb">例句</div>'+r.examples.map(function(x){return S(x.en,x.zh)}).join("")}
  if(r.replies&&r.replies.length){h+='<div class="lb">别人这么说，你可以这么回</div>'+r.replies.map(function(x){return S(x,"")}).join("")}
  return h+'</div>';
}
function render(){
  var c=$("chat"),h="";
  if(!msgs.length){
    h='<div class="hello"><h2>今天想学哪句？</h2>用中文问怎么说，或贴一句英文让我讲解。<div class="chips">'+SUGG.map(function(s){return '<button class="chip">'+s+'</button>'}).join("")+'</div>'+(apiKey?'':'<div class="chips"><button class="chip kb" id="keyBtn">🔑 设置 API Key</button></div>')+'</div>';
  }else msgs.forEach(function(m){
    if(m.role==="u")h+='<div class="u">'+esc(m.t)+'</div>';
    else if(m.err)h+='<div class="a err">'+esc(m.err)+'</div>';
    else h+=aiHtml(m.d);
  });
  if(busy)h+='<div class="th">思考中…</div>';
  c.innerHTML=h;c.scrollTop=c.scrollHeight;
  Array.prototype.forEach.call(c.querySelectorAll(".chip:not(.kb)"),function(b){b.onclick=function(){$("q").value=b.textContent;ask()}});
  var kb=$("keyBtn");if(kb)kb.onclick=function(){$("bSet").click()};
  $("send").disabled=busy;
}

/* 问 AI */
var SYS="你是一位美式英语口语老师，学生是中文母语的初学者。只用简单、自然、日常的美式口语（多用缩写，如 gonna、wanna、I'm），不要书面语或复杂语法。"+
"如果学生用中文，给出最自然的美式口语说法；如果学生写的是英文，先在 note 里指出语法或用词问题（最多2点），再给更自然的说法。"+
"只返回 JSON，不要任何其他文字或代码块标记，格式："+
'{"en":"最自然的一句英文","zh":"这句的中文意思","note":"用中文简短说明含义、用法、语气（2-3句）","vocab":[{"w":"关键词或搭配","m":"中文意思"}],"examples":[{"en":"例句","zh":"中文翻译"},{"en":"例句","zh":"中文翻译"}],"replies":["常见的自然回答1","常见的自然回答2"]}';
/* 自带 Key：直接从浏览器调用 Anthropic API */
var apiKey="",apiModel="claude-sonnet-5-5";
try{apiKey=localStorage.getItem("apikey")||"";apiModel=localStorage.getItem("apimodel")||apiModel}catch(e){}
function b64(blob){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(String(r.result).split(",")[1])};r.onerror=rej;r.readAsDataURL(blob)})}
sample={
  limits:function(){return Promise.resolve({images:{maxCount:8}})},
  json:async function(prompt,opts){
    if(!apiKey)throw {code:"not_granted"};
    var content=[],imgs=(opts&&opts.images)||[],i;
    for(i=0;i<imgs.length;i++)content.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:await b64(imgs[i])}});
    content.push({type:"text",text:prompt});
    var r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
      headers:{"content-type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:apiModel,max_tokens:2000,messages:[{role:"user",content:content}]})});
    if(!r.ok)throw {code:(r.status===401||r.status===403)?"not_granted":"error"};
    var d=await r.json(),t=(d.content||[]).map(function(x){return x.text||""}).join("").replace(/```json|```/g,"").trim();
    var m=t.match(/[\[{][\s\S]*[\]}]/);
    return JSON.parse(m?m[0]:t);
  }
};
function ask(){
  var q=$("q").value.trim();if(!q||busy)return;
  $("q").value="";$("q").style.height="";
  msgs.push({role:"u",t:q});busy=true;render();
  if(!sample){busy=false;msgs.push({role:"a",err:"当前环境无法使用 AI 功能。"});render();return}
  sample.json(SYS+"\n\n学生输入："+q).then(function(r){
    msgs.push({role:"a",d:r});
    if(r&&r.en){hist=hist.filter(function(x){return x.en!==r.en});hist.unshift({en:r.en,zh:r.zh||""});hist=hist.slice(0,50);sv("hist",hist)}
  }).catch(function(e){
    msgs.push({role:"a",err:e&&e.code==="not_granted"?"请先点右上角 ⚙️，填写 API Key。":"出错了，请再试一次。"});
  }).then(function(){busy=false;msgs=msgs.slice(-30);sv("msgs",msgs);render()});
}
$("send").onclick=ask;
$("q").oninput=function(){this.style.height="auto";this.style.height=Math.min(this.scrollHeight,120)+"px"};
$("bNew").onclick=function(){stopLoop();msgs=[];sv("msgs",msgs);render()};

/* 点句子 → 底部菜单 */
function sheet(en,zh){
  $("sheet").innerHTML='<div class="en">'+esc(en)+'</div>'+(zh?'<div class="zh">'+esc(zh)+'</div>':'')+
  '<div class="acts"><button id="aS">🔊 朗读</button><button id="aF">'+(isFav(en)?'★ 取消收藏':'☆ 收藏')+'</button><button id="aC">复制</button></div>';
  $("mask").classList.remove("hide");
  $("aS").onclick=function(){say(en)};
  $("aF").onclick=function(){
    favs=isFav(en)?favs.filter(function(f){return f.en!==en}):[{en:en,zh:zh}].concat(favs);
    sv("favs",favs);$("mask").classList.add("hide");if(!$("col").classList.contains("hide"))list();
  };
  $("aC").onclick=function(){try{navigator.clipboard.writeText(en)}catch(e){}$("mask").classList.add("hide")};
}
$("mask").onclick=function(e){if(e.target===this)this.classList.add("hide")};
document.addEventListener("click",function(e){
  var t=e.target.closest&&e.target.closest(".pb,.fb"),s=t&&t.closest(".s");
  if(!s)return;
  var en=s.dataset.en,zh=s.dataset.zh;
  if(t.classList.contains("pb")){say(en);return}
  favs=isFav(en)?favs.filter(function(f){return f.en!==en}):[{en:en,zh:zh}].concat(favs);
  sv("favs",favs);
  Array.prototype.forEach.call(document.querySelectorAll(".s"),function(x){
    if(x.dataset.en===en){var b=x.querySelector(".fb");b.textContent=isFav(en)?"★":"☆";b.classList.toggle("on",isFav(en))}
  });
});

/* 句库页 */
var tabNow="F",showZh=true;
function list(){
  var a=tabNow==="F"?favs:hist;
  $("tF").className="tab"+(tabNow==="F"?" on":"");$("tR").className="tab"+(tabNow==="R"?" on":"");
  $("lst").innerHTML=a.length?a.map(function(x){return S(x.en,showZh?x.zh:"")}).join(""):
    '<div class="empty">'+(tabNow==="F"?"还没有收藏。点句子旁边的 ☆ 就能收藏。":"这里会显示你最近问过的句子。")+'</div>';
}
$("bCol").onclick=function(){$("col").classList.remove("hide");list()};
$("bBack").onclick=function(){stopLoop();$("col").classList.add("hide")};
$("tF").onclick=function(){tabNow="F";list()};$("tR").onclick=function(){tabNow="R";list()};
$("zhT").onclick=function(){showZh=!showZh;this.textContent=showZh?"隐藏中文":"显示中文";list()};
$("loop").onclick=function(){
  if(looping){stopLoop();return}
  var a=tabNow==="F"?favs:hist;if(!a.length)return;
  looping=true;this.textContent="⏹ 停止";var i=0;
  (function next(){if(!looping)return;say(a[i%a.length].en,function(){i++;setTimeout(next,1200)})})();
};
/* 抽卡 */
var deck=[],di=0,cur=null,shown=false;
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function showCard(){
  $("cbox").innerHTML='<div class="cnt">'+di+' / '+deck.length+'</div><div class="en">'+esc(cur.en)+'</div>'+
    (shown?'<div class="zh">'+esc(cur.zh||"（没有中文）")+'</div>':'<div class="hint">点一下卡片查看中文</div>');
}
function draw(){
  if(!favs.length){cur=null;$("cbox").innerHTML='<div class="empty" style="margin:0">还没有收藏。<br>先收藏几句再来抽卡。</div>';return}
  if(di>=deck.length){
    deck=shuffle(favs);di=0;
    if(deck.length>1&&cur&&deck[0].en===cur.en)deck.push(deck.shift());
  }
  cur=deck[di++];shown=false;showCard();say(cur.en);
}
$("cbox").onclick=function(){if(!cur||shown)return;shown=true;showCard()};
$("cNext").onclick=draw;
$("cSay").onclick=function(){if(cur)say(cur.en)};
$("bCard").onclick=function(){stopLoop();deck=[];di=0;cur=null;$("card").classList.remove("hide");draw()};
$("cBack").onclick=function(){stopLoop();$("card").classList.add("hide")};
/* 朗读设置 */
$("bSet").onclick=function(){
  pv();
  var o=voices.map(function(v){return '<option value="'+esc(v.name)+'"'+(voice&&v.name===voice.name?' selected':'')+'>'+esc(v.name)+'</option>'}).join("");
  var names={"0.7":"慢","0.85":"适中","1":"正常"};
  $("sheet").innerHTML='<b>朗读设置</b><div class="lb">音色（美式英语）'+(voices.length?'':'：没找到，请检查系统的文字转语音设置')+'</div><select id="vsel" class="sel">'+o+'</select>'+
  '<div class="lb">语速</div><div class="acts" id="rts">'+[.7,.85,1].map(function(r){return '<button data-r="'+r+'" class="'+(r===rate?'on':'')+'">'+names[r]+'</button>'}).join("")+'</div>'+
  '<div class="acts"><button id="try">🔊 试听</button></div>'+
  '<div class="lb">Anthropic API Key（只保存在这个浏览器里）</div><input id="akey" class="sel" type="password" placeholder="sk-ant-…" autocomplete="off" value="'+esc(apiKey)+'">'+
  '<div class="lb">模型</div><select id="amod" class="sel"><option value="claude-sonnet-5-5">Sonnet 5.5（更准）</option><option value="claude-haiku-5-5">Haiku 5.5（更快更省）</option></select>';
  $("mask").classList.remove("hide");
  $("vsel").onchange=function(){
    voice=voices.filter(function(v){return v.name===$("vsel").value})[0]||null;
    try{localStorage.setItem("voice",$("vsel").value)}catch(e){}
    say("Hey, how's it going? I'm gonna grab some coffee.");
  };
  Array.prototype.forEach.call($("rts").children,function(b){b.onclick=function(){
    rate=+b.dataset.r;try{localStorage.setItem("rate",String(rate))}catch(e){}
    Array.prototype.forEach.call($("rts").children,function(x){x.classList.toggle("on",x===b)});
    say("Hey, how's it going? I'm gonna grab some coffee.");
  }});
  $("try").onclick=function(){say("Hey, how's it going? I'm gonna grab some coffee.")};
  $("amod").value=apiModel;
  $("akey").onchange=function(){apiKey=this.value.trim();try{localStorage.setItem("apikey",apiKey)}catch(e){}};
  $("amod").onchange=function(){apiModel=this.value;try{localStorage.setItem("apimodel",apiModel)}catch(e){}};
};
/* 视频字幕 */
var vsubs=[],nowI=-1,scanning=false,vurl=null;
function vs(m){$("vst").textContent=m}
function addSubs(a){
  vsubs=vsubs.concat(a).sort(function(x,y){return x.t-y.t}).filter(function(c,i,arr){return !(i&&arr[i-1].en.toLowerCase()===c.en.toLowerCase())});
  nowI=-1;renderV();
}
function renderV(){
  $("vl").innerHTML=vsubs.map(function(c){
    var m=Math.floor(c.t/60),sec=Math.floor(c.t%60);
    return '<div class="s" data-en="'+esc(c.en)+'" data-zh="'+esc(c.zh)+'"><div class="tx"><div class="en">'+esc(c.en)+'</div>'+(c.zh?'<div class="zh">'+esc(c.zh)+'</div>':'')+'<button class="tm" data-t="'+c.t+'">▶ '+m+':'+(sec<10?'0':'')+sec+'</button></div>'+AC(c.en)+'</div>';
  }).join("");
}
document.addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest(".tm");
  if(b){var v=$("vp");v.currentTime=+b.dataset.t;v.play()}
});
$("vp").ontimeupdate=function(){
  var ct=this.currentTime,idx=-1,i;
  for(i=0;i<vsubs.length;i++){if(vsubs[i].t<=ct)idx=i;else break}
  if(idx!==nowI){nowI=idx;var rows=$("vl").children;for(i=0;i<rows.length;i++)rows[i].classList.toggle("now",i===idx)}
};
$("bVid").onclick=function(){$("vid").classList.remove("hide")};
$("bVBack").onclick=function(){scanning=false;$("vp").pause();$("vid").classList.add("hide")};
$("vf").onchange=function(){
  var f=this.files[0];if(!f)return;
  if(vurl)URL.revokeObjectURL(vurl);
  vurl=URL.createObjectURL(f);$("vp").src=vurl;vsubs=[];renderV();vs("已加载："+f.name);
};
$("vp").onerror=function(){if($("vp").src)vs("这个视频格式无法在页面里播放，换成 mp4 试试。")};
function ts(x){return x.trim().replace(",",".").split(":").map(parseFloat).reduce(function(a,p){return a*60+p},0)}
$("sf").onchange=function(){
  var f=this.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    var out=[];
    String(r.result).replace(/\r/g,"").split(/\n\n+/).forEach(function(blk){
      var L=blk.split("\n"),k=-1,i;
      for(i=0;i<L.length;i++){if(L[i].indexOf("-->")>-1){k=i;break}}
      if(k<0)return;
      var t=ts(L[k].split("-->")[0]);if(isNaN(t))return;
      var en=[],zh=[];
      L.slice(k+1).forEach(function(l){l=l.replace(/<[^>]+>/g,"").trim();if(!l)return;(/[\u4e00-\u9fff]/.test(l)?zh:en).push(l)});
      if(en.length)out.push({t:t,en:en.join(" "),zh:zh.join(" ")});
    });
    addSubs(out);vs(out.length?"已导入 "+out.length+" 句字幕。":"没读到英文字幕，请检查文件。");
  };
  r.readAsText(f);
};
function frame(v,t){
  return new Promise(function(res){
    var tm=setTimeout(function(){res(null)},6000);
    v.onseeked=function(){
      v.onseeked=null;clearTimeout(tm);
      try{
        var sh=v.videoHeight*0.4,cw=Math.min(v.videoWidth,800),ch=Math.round(cw*sh/v.videoWidth);
        var c=document.createElement("canvas");c.width=cw;c.height=ch;
        c.getContext("2d").drawImage(v,0,v.videoHeight-sh,v.videoWidth,sh,0,0,cw,ch);
        c.toBlob(function(b){res(b)},"image/jpeg",.7);
      }catch(e){res(null)}
    };
    v.currentTime=t+0.05;
  });
}
$("scan").onclick=async function(){
  if(scanning){scanning=false;return}
  var v=$("vp");
  if(!v.src||!v.duration){vs("请先选择视频。");return}
  if(!sample){vs("当前环境无法使用 AI 功能。");return}
  var lim=null;try{lim=await sample.limits()}catch(e){}
  if(!lim||!lim.images){vs("当前环境不支持让 AI 看图片。");return}
  var B=Math.min(lim.images.maxCount||8,8),step=3,N=60,t0=v.currentTime,found=0,done=0;
  scanning=true;this.textContent="⏹ 停止";v.pause();
  try{
    for(var b=0;b<N&&scanning;b+=B){
      var times=[],blobs=[],k,t,bl;
      for(k=b;k<Math.min(b+B,N);k++){
        t=t0+k*step;if(t>=v.duration)break;
        bl=await frame(v,t);if(bl){times.push(t);blobs.push(bl)}
      }
      if(!blobs.length)break;
      vs("识别中… "+done+"/"+N+"（每 3 秒取一帧）");
      var r=await sample.json(`下面是一段视频中按顺序截取的 ${blobs.length} 张画面（只含画面下半部分），编号 0 到 ${blobs.length-1}。请读出每张画面里的字幕文字。只返回 JSON 数组，每张画面一个对象：{"i":编号,"en":"英文字幕，没有则为空字符串","zh":"中文字幕，没有则为空字符串"}。看不清就留空，不要猜测。`,{images:blobs,cache:false});
      var add=[];
      (Array.isArray(r)?r:[]).forEach(function(o){
        var tt=times[o&&o.i];
        if(tt==null||!o.en||!String(o.en).trim())return;
        add.push({t:tt,en:String(o.en).trim(),zh:o.zh?String(o.zh).trim():""});
      });
      found+=add.length;done+=blobs.length;addSubs(add);
      if(times.length<B)break;
    }
    vs(found?"识别完成，共 "+found+" 句。点 ▶ 跳转，点句子收藏。想继续就把进度条拖到后面再识别。":"这一段没识别到英文字幕。");
  }catch(e){
    vs(e&&e.code==="not_granted"?"请先点右上角 ⚙️，填写 API Key。":"识别出错了，请再试一次。");
  }
  scanning=false;v.currentTime=t0;$("scan").textContent="🔍 AI 识别画面字幕";
};
render();
</script>
