<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>口语句库</title>
<meta name="theme-color" content="#f2f2f7">
<style>
:root{--bg:#f2f2f7;--fg:#1c1c1e;--mut:#6e6e73;--card:rgba(255,255,255,.62);--acc:#007aff;--accfg:#fff;--bd:rgba(60,60,67,.16);--hl:rgba(0,122,255,.12);--glass:rgba(248,248,250,.72);--bl1:rgba(120,170,255,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#f5f5f7;--mut:#98989f;--card:rgba(44,44,48,.55);--acc:#0a84ff;--accfg:#fff;--bd:rgba(255,255,255,.13);--hl:rgba(10,132,255,.24);--glass:rgba(28,28,30,.7);--bl1:rgba(10,90,200,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--fg:#f5f5f7;--mut:#98989f;--card:rgba(44,44,48,.55);--acc:#0a84ff;--accfg:#fff;--bd:rgba(255,255,255,.13);--hl:rgba(10,132,255,.24);--glass:rgba(28,28,30,.7);--bl1:rgba(10,90,200,.35);color-scheme:dark}
*{box-sizing:border-box}
html{height:100%;margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,"PingFang SC","Noto Sans SC",system-ui,sans-serif}
body{display:flex;flex-direction:column;height:100%;margin:0 auto;max-width:680px;background:transparent;padding-top:env(safe-area-inset-top,20px);padding-bottom:env(safe-area-inset-bottom,20px)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
header{display:flex;align-items:center;justify-content:space-between;padding:4px 8px;border-bottom:1px solid var(--bd)}
header b{font-size:17px}.ib{width:42px;height:42px;font-size:20px;border-radius:10px}
#chat{flex:1;overflow-y:auto;padding:12px 14px}
.u{background:var(--acc);color:var(--accfg);padding:9px 13px;border-radius:16px 16px 4px 16px;margin:10px 0 10px auto;max-width:85%;width:fit-content;white-space:pre-wrap}
.a{margin:10px 0}.s{background:var(--card);border-radius:14px;padding:10px 8px 10px 12px;margin:6px 0;display:flex;gap:6px;align-items:flex-start}
.tx{flex:1;min-width:0}.ac{display:flex;gap:2px;flex:none}.ac button{width:38px;height:38px;font-size:18px;border-radius:10px}
.ac button:active{background:var(--hl)}.fb.on{color:#f5a623}.en{font-size:19px;font-weight:600;line-height:1.35}
.zh{color:var(--mut);font-size:15px}.lb{font-size:13px;color:var(--mut);margin:14px 0 2px}.note{margin-top:6px}
.th{color:var(--mut);padding:8px 0}.err{color:#d33}.hello{text-align:center;color:var(--mut);margin-top:9vh}
.hello h2{color:var(--fg);margin:0 0 6px}.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:8px 14px;border-radius:999px;font-size:14px}
.inp{display:flex;gap:8px;align-items:flex-end;padding:8px 10px;border-top:1px solid var(--bd)}
textarea{flex:1;max-height:120px;min-height:42px;padding:10px 14px;border-radius:22px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:inherit;resize:none}
#send{width:42px;height:42px;border-radius:50%;background:var(--acc);color:var(--accfg);font-size:18px;flex:none}
#send:disabled{opacity:.4}
.ov{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;max-width:680px;margin:0 auto;padding-top:env(safe-area-inset-top,20px);padding-bottom:env(safe-area-inset-bottom,20px)}
.tabs{display:flex;gap:6px;padding:8px 12px}.tab{padding:6px 16px;border-radius:999px;border:1px solid var(--bd);font-size:14px}
.tab.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}#lst{flex:1;overflow-y:auto;padding:0 14px}
.empty{color:var(--mut);text-align:center;margin-top:60px}.lp{display:flex;gap:10px;padding:10px 12px;border-top:1px solid var(--bd)}
.lp button{flex:1;padding:11px;border-radius:12px;background:var(--acc);color:var(--accfg);font-weight:600}
.lp button.g{background:var(--card);color:var(--fg)}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:680px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .en{font-size:18px}.acts{display:flex;gap:8px;margin-top:14px}.acts button{flex:1;padding:11px 4px;border-radius:12px;background:var(--card);font-size:15px}
.vv{width:100%;max-height:34vh;background:#000}.vb{display:flex;gap:8px;padding:8px 12px;flex-wrap:wrap}
.vb .tab{cursor:pointer}.vst{padding:0 14px 6px;color:var(--mut);font-size:13px;min-height:22px}
#vl{flex:1;overflow-y:auto;padding:0 14px}.s.now{background:var(--hl)}.tm{margin-top:4px;font-size:13px;color:var(--acc)}
.sel{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:inherit}
.acts button.on{background:var(--acc);color:var(--accfg)}
:root{--fx:radial-gradient(80% 50% at 50% -10%,var(--bl1),transparent 70%)}
html{background:var(--fx),var(--bg);background-attachment:fixed}.ov{background:var(--fx),var(--bg)}
.s,header,.inp,.chip,.tab,.sheet,.lp{-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
header{background:var(--glass);border-bottom:.5px solid var(--bd)}header b{font-size:17px;font-weight:600}
.s{background:var(--card);border:.5px solid var(--bd);border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.s.now{background:var(--hl);border-color:var(--acc)}.u{background:var(--acc);color:#fff;border-radius:18px 18px 4px 18px}
.lb{font-size:12px;color:var(--mut);margin:16px 0 4px 4px}.inp,.lp{background:var(--glass);border-top:.5px solid var(--bd)}
textarea{background:var(--card);border:.5px solid var(--bd);border-radius:21px}textarea:focus{outline:0;border-color:var(--acc)}
.chip,.tab{background:var(--card);border:.5px solid var(--bd)}.tab.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.sheet{max-height:88vh;overflow-y:auto;background:var(--glass);border-top:.5px solid var(--bd);box-shadow:0 -12px 40px rgba(0,0,0,.16)}
.mask{background:rgba(0,0,0,.28)}.fb.on{color:#ff9f0a}
.modes{display:flex;gap:8px;padding:8px 12px 0;overflow-x:auto;background:var(--glass);border-top:.5px solid var(--bd);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.mode{flex:none;padding:7px 15px;border-radius:999px;background:var(--card);border:.5px solid var(--bd);font-size:14px}
.mode.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}.inp{border-top:0}
.hl,.hlb{background:var(--hl);color:var(--acc);padding:2px 11px;border-radius:13px;font-weight:600;display:inline-block;line-height:1.5;margin:1px 2px;cursor:pointer}
.hlb{cursor:default;font-size:24px;padding:7px 18px;border-radius:18px}.hl:active{opacity:.6}
.a p{margin:7px 0}.big{font-size:20px}.zt{color:var(--mut);font-size:15px}
.mask.c{align-items:center;padding:24px}.pop{width:100%;max-width:420px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border:.5px solid var(--bd);border-radius:22px;padding:22px 20px 16px;box-shadow:0 12px 32px rgba(0,0,0,.28)}
.prow{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:20px}.prow button{padding:10px 14px;border-radius:999px;font-size:15px}
#psp{color:var(--acc);font-weight:600}.pfav{background:var(--card);font-weight:600}
.w{border-radius:8px;cursor:pointer}.w.on{background:var(--acc);color:var(--accfg)}
.dict{margin-top:14px;padding:10px 12px;border-radius:14px;background:var(--card);font-size:15px;min-height:44px}
.dsp{margin-left:4px;font-size:16px}.w{border-bottom:1px dotted rgba(140,140,150,.6)}.dict:empty{display:none}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:60;background:var(--glass);color:var(--fg);border:.5px solid var(--bd);padding:10px 18px;border-radius:999px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.3);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.row{position:relative;overflow:hidden;border-radius:14px;margin:6px 0}.row .s{margin:0;position:relative;z-index:1;touch-action:pan-y;-webkit-user-select:none;user-select:none;transition:transform .2s}
.row.now .s{background:var(--hl);border-color:var(--acc)}.a1,.a2{position:absolute;top:0;bottom:0;display:none;align-items:stretch}
.a1{left:0;width:140px;background:#ff9f0a;color:#fff;font-weight:600;align-items:center;padding-left:22px}.a2{right:0}
.row.revR .a1{display:flex}.row.revL .a2{display:flex}
.a2 button{width:76px;color:#fff;font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.a2 small{font-size:12px}.a2 .tb{background:var(--acc)}.a2 .dl{background:#ff453a}
.st{color:#ff9f0a;font-size:16px;flex:none;width:18px;text-align:center}
.yrow{display:flex;gap:8px;padding:0 12px 8px}.yrow input{flex:1}
#ytwrap{width:100%;aspect-ratio:16/9;max-height:34vh;background:#000}#ytwrap iframe{width:100%;height:100%;border:0}
.vc{display:flex;gap:12px;padding:12px;margin-bottom:12px;background:#1e1e1e;border-radius:16px;cursor:pointer;align-items:center;transition:background .2s}
.vc:active{background:#2a2a2a}
.vc img,.vc .cover{width:130px;height:74px;border-radius:10px;object-fit:cover;flex:none;background:#333;display:flex;align-items:center;justify-content:center;font-size:24px}
.vt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.vt b{font-size:15px;font-weight:500;line-height:1.4;color:#f1f1f1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vt span{color:#888;font-size:12px}
.tcs{display:flex;gap:8px;flex-wrap:wrap;padding:8px 0 16px}
#vid.pm{--bg:#0f0f0f;--fg:#f1f1f1;--mut:#aaa;--card:#1f1f1f;--bd:#333;--hl:rgba(255,255,255,.1);--acc:#3ea6ff;--accfg:#0f0f0f;--glass:#0f0f0f;background:#0f0f0f;color:#f1f1f1}
#vid.pm .vb,#vid.pm .yrow{display:none}
#vid.pm .vst{padding:0 20px 6px;font-size:13px;min-height:0;color:var(--mut)}
#vid.pm .vst:not(.show){display:none}
#vid.pm #ytwrap,#vid.pm .vv{width:calc(100% - 32px);margin:12px auto;border-radius:16px;overflow:hidden;display:block;background:#000}
#vid.pm #vl{padding:0 20px}#vid.pm #vl .row{border-radius:0;border:none;background:transparent}
#vid.pm #vl .s{background:transparent;border:0;box-shadow:none;padding:16px 2px;opacity:.45;transition:opacity .25s}
#vid.pm #vl .row.now .s{background:transparent;opacity:1}
#vid.pm #vl .row.now .en{color:var(--acc)}#vid.pm #vl .en{font-size:22px;font-weight:600;line-height:1.4}
#vid.pm #vl .zh{font-size:16px;color:var(--mut);margin-top:4px}#vid.pm #vl .tm{display:none}#vid.pm .w{border-bottom:0}
#vl.m-en .zh{display:none}#vl.m-zh .en{display:none}#vl.m-zh .s.nozh .en{display:block}
#vl.fs-mode{position:fixed!important;bottom:80px!important;left:0!important;right:0!important;z-index:9999!important;pointer-events:none;background:transparent}
#vl.fs-mode .row{display:none}#vl.fs-mode .row.now{display:block;background:rgba(0,0,0,0.6);border-radius:10px;padding:10px 20px;width:fit-content;margin:0 auto}
#vl.fs-mode .row.now .s{opacity:1}#vl.fs-mode .row.now .en{color:#fff;font-size:22px;text-shadow:0 1px 3px #000}
#vl.fs-mode .row.now .zh{color:#ddd;font-size:18px;text-shadow:0 1px 3px #000}
#ctl{padding:12px 20px 8px;background:#0f0f0f;border-top:1px solid #222}
.prog{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px}.prog input{flex:1;accent-color:var(--acc)}
.cbtns{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
.cb{min-width:52px;height:46px;border-radius:999px;font-size:15px;color:var(--fg);display:inline-flex;align-items:center;justify-content:center}
.cb.play{width:64px;height:64px;background:var(--fg);color:#101012}
.cx{display:flex;gap:12px;justify-content:center;padding:8px 0 4px;flex-wrap:wrap}.cb.sm{height:36px;min-width:0;font-size:13px;padding:0 16px;background:#1f1f1f;border-radius:18px}
#vid.pm #ytwrap.hide,#vid.pm .vv.hide{display:none}.sys{text-align:center;color:var(--mut);font-size:13px;margin:16px 0 6px}
.tgrid{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.hide{display:none}
</style>
</head>
<body>
<header>
  <button class="ib" id="bCol" aria-label="收藏">⭐</button>
  <b>口语句库</b>
  <span><button class="ib" id="bSet" aria-label="朗读设置">⚙️</button><button class="ib" id="bVid" aria-label="视频字幕">🎬</button><button class="ib" id="bNew" aria-label="新对话">🗑</button></span>
</header>
<div id="chat"></div>
<div class="modes"><button class="mode on" data-m="say">英语怎么说</button><button class="mode" data-m="mean">什么意思</button><button class="mode" data-m="chat">💬 对话</button><button class="mode2" id="tpBtn" style="display:none">🎭 主题</button></div>
<div class="inp">
  <textarea id="q" rows="1" placeholder="想说什么？用中文问，或贴英文…"></textarea>
  <button id="send" aria-label="发送">➤</button>
</div>
<div class="ov hide" id="col">
  <header><button class="ib" id="bBack" aria-label="返回">←</button><b>我的句库</b><span class="ib"></span></header>
  <div class="tabs"><button class="tab on" id="tF">收藏</button><button class="tab" id="tR">最近</button></div>
  <div id="lst"></div>
  <div class="lp"><button id="loop">🔁 循环播放</button><button class="g" id="zhT">隐藏中文</button><button class="g" id="bCard">🎴 抽卡</button></div>
</div>
<div class="ov hide" id="vid">
  <header>
    <button class="ib" id="bVBack" aria-label="返回">←</button>
    <b>视频字幕</b>
    <button class="ib" id="bVidFav" style="display:none" aria-label="收藏">☆</button>
  </header>
  <video id="vp" class="vv hide" controls playsinline></video>
  <div id="ytwrap" class="hide"><div id="ytp"></div></div>
  <div class="vb">
    <button class="tab" id="bHis">📚 语料库</button>
    <label class="tab">📁 本地视频<input type="file" id="vf" accept="video/*,.mp4,.mkv,.webm,.mov,.m4v,.avi" hidden></label>
    <label class="tab">📄 导入字幕<input type="file" id="sf" accept=".srt,.vtt,.ass,.ssa,.lrc,.sbv,.txt" hidden></label>
    <button class="tab" id="ytBtn">🏠 首页</button>
  </div>
  <div class="yrow" id="yrow"><input id="yurl" class="sel" placeholder="搜索 YouTube，或粘贴视频链接…"><button class="tab on" id="ygo">搜索</button></div>
  <div class="vst" id="vst"></div>
  <div id="vl"></div>
  <div id="ctl" class="hide">
    <div class="prog"><span id="tcur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0"><span id="tdur">0:00</span></div>
    <div class="cbtns">
      <button class="cb" id="cSpd">1.0x</button><button class="cb" id="cPrev"></button><button class="cb play" id="cPlay"></button><button class="cb" id="cNext"></button><button class="cb" id="cMode">中英</button>
    </div>
    <div class="cx"><button class="cb sm" id="cImp">📄 导入字幕</button><button class="cb sm" id="scan">🤖 画面字幕</button><button class="cb sm" id="asr">🎙 语音识别</button></div>
  </div>
</div>
<div class="ov hide" id="card">
  <header><button class="ib" id="cBack" aria-label="返回">←</button><b>抽卡</b><span class="ib"></span></header>
  <div class="cwrap"><div class="cardbox" id="cbox"></div></div>
  <div class="chint">← 再来一次　·　会了 →</div>
  <div class="lp"><button class="g" id="cSay">🔊 再听一次</button><button id="cNext">下一张 ➜</button></div>
</div>
<div class="mask c hide" id="pmask"><div class="pop" id="pop"></div></div>
<div class="mask hide" id="mask"><div class="sheet" id="sheet"></div></div>

<script>
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function ld(k){try{return JSON.parse(localStorage.getItem(k)||"[]")}catch(e){return[]}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var msgs=ld("msgs"),favs=ld("favs"),hist=ld("hist"),sample=null,busy=false;

/* 拟人化朗读 */
var TONES={
  normal: {name:"正常", rate:0.9, pitch:1.0, pause:400},
  gentle: {name:"温柔", rate:0.85, pitch:1.05, pause:450},
  excited:{name:"激动", rate:1.05, pitch:1.1, pause:250},
  sad:    {name:"低沉", rate:0.8, pitch:0.85, pause:600},
  serious:{name:"严肃", rate:0.85, pitch:0.9, pause:450}
};
var currentTone = localStorage.getItem("tone") || "normal";
if(!TONES[currentTone]) currentTone = "normal";
var rate=TONES[currentTone].rate, pitch=TONES[currentTone].pitch;
var voices=[],voice=null;
function TTSN(){try{return (window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.TextToSpeech)||null}catch(e){return null}}
function setVoices(list){voices=list;var n=null;try{n=localStorage.getItem("voice")}catch(e){};voice=voices.filter(function(x){return x.name===n})[0]||voices[0]||null}
function pv(){var T=TTSN();if(T&&T.getSupportedVoices){T.getSupportedVoices().then(function(r){setVoices((r.voices||[]).map(function(v,i){return {name:(v.name||v.voiceURI||("voice "+i)),lang:String(v.lang||""),idx:i}}).filter(function(x){return x.lang.replace("_","-").toLowerCase()==="en-us"}));}).catch(function(){});return}try{setVoices(speechSynthesis.getVoices().filter(function(x){return x.lang.replace("_","-")==="en-US"}))}catch(e){}}
pv();setTimeout(pv,1500);try{speechSynthesis.onvoiceschanged=pv}catch(e){}
var looping=false,spk=0;
function webSay(txt,cb){try{var u=new SpeechSynthesisUtterance(txt);u.lang="en-US";u.rate=rate;u.pitch=pitch;if(typeof SpeechSynthesisVoice!=="undefined"&&voice instanceof SpeechSynthesisVoice)u.voice=voice;u.onend=u.onerror=function(){cb()};speechSynthesis.speak(u);}catch(e){cb()}}
function say(t,done){
  var id=++spk,T=TTSN();try{if(T)T.stop()}catch(e){};try{speechSynthesis.cancel()}catch(e){}
  var toneCfg = TONES[currentTone] || TONES["normal"];
  var parts=t.match(/[^.!?]+[.!?]*/g)||[t],i=0;
  (function next(){
    if(id!==spk)return;if(i>=parts.length){done&&done();return}
    var txt=parts[i++].trim(),more=i<parts.length;
    var after=function(){if(id!==spk)return;setTimeout(next,more?toneCfg.pause:0)};
    if(T){var o={text:txt,lang:"en-US",rate:rate,pitch:pitch,volume:1};if(voice&&voice.idx!=null)o.voice=voice.idx;T.speak(o).then(after).catch(function(){if(id!==spk)return;webSay(txt,after)});}else webSay(txt,after);
  })();
}
function stopLoop(){looping=false;spk++;var T=TTSN();try{if(T)T.stop()}catch(e){};try{speechSynthesis.cancel()}catch(e){};$("loop").textContent="🔁 循环播放"}
function isFav(en){return favs.some(function(f){return f.en===en})}

function S(en,zh,mid,o){
  o=o||{};return '<div class="row"><div class="a1">'+(isFav(en)?'☆ 取消收藏':'★ 收藏')+'</div><div class="a2">'+(mid?'<button class="tb">💬<small>溯源</small></button>':'')+(o.del?'<button class="dl">🗑<small>删除</small></button>':'')+'</div><div class="s'+(zh?'':' nozh')+'" data-en="'+esc(en)+'" data-zh="'+esc(zh||"")+'" data-mid="'+esc(mid||"")+'"><div class="tx"><div class="en">'+wordsHtml(en)+'</div>'+(zh?'<div class="zh">'+esc(zh)+'</div>':'')+(o.extra||'')+'</div><span class="st">'+(isFav(en)?'★':'')+'</span></div></div>';

function mergeCues(raw,asr){var out=[],cur=null,max=asr?90:150;raw.forEach(function(c){var t=c.s.replace(/\[[^\]]*\]/g,"").replace(/\s+/g," ").trim();if(!t)return;if(cur&&(cur.en+" "+t).length<=max&&!/[.!?…]["”')]?$/.test(cur.en)&&c.t-cur.last<2){cur.en+=" "+t;cur.last=c.t}else{if(cur)out.push({t:cur.t,en:cur.en,zh:""});cur={t:c.t,en:t,last:c.t}}});if(cur)out.push({t:cur.t,en:cur.en,zh:""});return out}

function unent(x){var t=document.createElement("textarea");t.innerHTML=x;return t.value}
function parseTimed(txt){txt=String(txt||"").trim();var raw=[],i,x;if(!txt)return raw;if(txt.charAt(0)==="{"){try{var obj=JSON.parse(txt);(obj.events||[]).forEach(function(e){if(!e.segs)return;x=e.segs.map(function(g){return g.utf8||""}).join("").replace(/\s+/g," ").trim();if(x)raw.push({t:(e.tStartMs||0)/1000,s:x})});return raw}catch(e){return raw}}var doc=new DOMParser().parseFromString(txt,"text/xml"),ns=doc.getElementsByTagName("text");if(ns.length){for(i=0;i<ns.length;i++){x=unent(ns[i].textContent).replace(/\s+/g," ").trim();if(x)raw.push({t:parseFloat(ns[i].getAttribute("start")||0),s:x})}return raw}var ps=doc.getElementsByTagName("p");for(i=0;i<ps.length;i++){x=unent(ps[i].textContent).replace(/\s+/g," ").trim();if(x)raw.push({t:parseFloat(ps[i].getAttribute("t")||0)/1000,s:x})}return raw}

async function fetchTracks(tracks, ua){
  var en=tracks.filter(function(x){return /^en/i.test(x.languageCode)});
  var pick=en.filter(function(x){return x.kind!=="asr"})[0]||en[0],extra="";
  if(!pick){pick=tracks[0];extra="&tlang=en"}
  var fmts=["&fmt=json3","","&fmt=srv3"];
  for(var f=0;f<fmts.length;f++){
    try{
      var u=pick.baseUrl.replace(/&fmt=[^&]*/,"")+extra+fmts[f];
      var h2={"origin":"https://www.youtube.com","referer":"https://www.youtube.com/"};
      if(ua) h2["user-agent"]=ua;
      var r2=await fetch(u,{headers:h2});
      if(!r2.ok) continue;
      var tx=await r2.text();
      if(!tx.trim()) continue;
      var raw=parseTimed(tx);
      if(raw.length) return mergeCues(raw,pick.kind==="asr");
    }catch(e){}
  }
  return null;
}

async function ytCaptions(id){
  var diag=[],i;
  
  // 方案 1：通过 5 种 API 客户端尝试
  for(i=0;i<YT_CLIENTS.length;i++){
    var c=YT_CLIENTS[i],h={"content-type":"application/json"},tracks=null;
    if(c.ua)h["user-agent"]=c.ua;
    try{
      var r=await fetch("https://www.youtube.com/youtubei/v1/player?prettyPrint=false",{method:"POST",headers:h,body:JSON.stringify({context:c.ctx,videoId:id,contentCheckOk:true,racyCheckOk:true})});
      if(!r.ok){diag.push(c.n+" HTTP "+r.status);continue}
      var d=await r.json();
      tracks=d.captions&&d.captions.playerCaptionsTracklistRenderer&&d.captions.playerCaptionsTracklistRenderer.captionTracks;
      if(tracks&&tracks.length){
        var cues = await fetchTracks(tracks, c.ua);
        if(cues && cues.length) return cues;
        else diag.push(c.n+" 轨道下载失败");
      } else {
        var pStatus = d.playabilityStatus && d.playabilityStatus.status;
        diag.push(c.n+" 无字幕"+(pStatus?"("+pStatus+")":""));
      }
    }catch(e){diag.push(c.n+" 网络失败");}
  }
  
  // 方案 2：直接抓取网页 HTML
  try {
    diag.push("网页抓取");
    var hr = await fetch("https://www.youtube.com/watch?v="+id+"&hl=en");
    var html = await hr.text();
    var match = html.match(/ytInitialPlayerResponse\s*=\s*({.+?})\s*;/);
    if(match && match[1]){
      var d2 = JSON.parse(match[1]);
      var tr2 = d2.captions&&d2.captions.playerCaptionsTracklistRenderer&&d2.captions.playerCaptionsTracklistRenderer.captionTracks;
      if(tr2&&tr2.length){
        var cues2 = await fetchTracks(tr2, null);
        if(cues2 && cues2.length) return cues2;
        else diag.push("网页解析下载失败");
      } else {
        diag.push("网页无字幕");
      }
    } else {
      diag.push("网页格式错误");
    }
  } catch(e){ diag.push("网页请求失败"); }
  
  if(diag.every(function(x){return x.indexOf("无字幕")>-1 || x.indexOf("无字幕轨道")>-1})) return [];
  throw {detail:diag.join(" | ")};
}

async function ytLoad(id, title){
  currentYt = {id: id, title: title || 'YouTube Video'};
  updateYtFavBtn();
  runId++;scanning=false;ytId=id;setSrc("yt");resetRate();vsubs=[];renderV();
  try{$("vp").pause()}catch(e){}
  vs("正在加载视频…");
  
  if(yt && yt.destroy) {
    try { yt.destroy(); } catch(e){}
    yt = null;
  }
  $("ytwrap").innerHTML = '<div id="ytp"></div>';

  try { await ytPlay(id); } 
  catch(e) {
    ytReady = null;
    vs("加载不了 YouTube 播放器：" + e + "。请检查网络是否能访问 YouTube。");
    return;
  }
  
  if (id !== ytId) return;

  clearInterval(ytTimer);
  ytTimer=setInterval(function(){if(ytMode&&yt&&yt.getCurrentTime){try{syncSubs(yt.getCurrentTime())}catch(e){}}},300);
  
  if(!cfg.key){
    vs("视频已加载。先点右上角 ⚙️ 填好 AI Key，才能翻译字幕。");
  }
  vs("正在获取字幕…");
  try{
    var cues=await ytCaptions(id);
    if(id!==ytId)return;
    if(!cues || !cues.length){
      vs("没有获取到字幕。可能该视频无字幕，或解析被拦截。");
      return;
    }
    addSubs(cues);
    if(!cfg.key){vs("已获取 "+cues.length+" 句字幕。填好 AI Key 后可自动翻译。");return}
    await ytTranslate(id);
  }catch(e){vs("获取字幕失败："+((e&&e.detail)||"未知原因")+"。可以点“导入字幕”手动导入。")}
}
