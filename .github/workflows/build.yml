name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 检查签名文件
        run: |
          test -f debug.keystore || { echo "缺少 debug.keystore，请把它上传到仓库最外层"; exit 1; }
          keytool -list -keystore debug.keystore -storepass android | grep -i androiddebugkey
      - name: 准备文件
        run: |
          [ -f www/index.html ] || { mkdir -p www; cp index.html www/; }
          [ -f assets/icon-only.png ] || { mkdir -p assets; cp icon-only.png assets/; }
      - name: 安装依赖并生成安卓项目
        run: |
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android @capacitor-community/text-to-speech
          npm install -D --legacy-peer-deps @capacitor/assets
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
      - name: 设置版本号并固定签名
        run: |
          sed -E -i "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          printf '\nandroid {\n    signingConfigs {\n        debug {\n            storeFile file("%s/debug.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }\n}\n' "$GITHUB_WORKSPACE" >> android/app/build.gradle
          grep -n "version" android/app/build.gradle
          tail -12 android/app/build.gradle
      - name: 打包 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kouyu-apk
