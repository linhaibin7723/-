name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 准备文件
        run: |
          [ -f www/index.html ] || { mkdir -p www; cp index.html www/; }
          [ -f assets/icon-only.png ] || { mkdir -p assets; cp icon-only.png assets/; }
      - name: 安装依赖并生成安卓项目
        run: |
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android @capacitor-community/text-to-speech
          npm install -D --legacy-peer-deps @capacitor/assets
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
      - name: 打包 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kouyu-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
